name: Build resume PDF

on:
  push:
    branches: [main]
    paths:
      - "resume/**"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile resume (pdflatex via TeXLive)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume

      - name: Move PDF into public/
        run: mv resume/resume.pdf public/resume.pdf

      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf
          if git diff --cached --quiet; then
            echo "resume.pdf unchanged — nothing to commit"
          else
            git commit -m "chore: rebuild resume.pdf [skip ci]"
            git push
          fi
